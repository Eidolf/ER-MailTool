name: Lint

on:
  workflow_call:
    inputs:
      fix:
        type: boolean
        default: false
        description: "Auto-fix issues?"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: |
          if [ "${{ inputs.fix }}" = "true" ]; then
            ruff check . --fix
            ruff format .
          else
            ruff check .
          fi

      - name: Commit Fixes
        if: inputs.fix == true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix linting issues"
          branch: ${{ github.head_ref }}
