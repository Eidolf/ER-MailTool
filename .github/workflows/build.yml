name: Build

on:
  workflow_call:
    inputs:
      release_version:
        type: string
        required: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: er-mailtool-linux
            binary_name: dist/er-mailtool
            sep: ":"
          - os: windows-latest
            artifact_name: er-mailtool-windows
            binary_name: dist/er-mailtool.exe
            sep: ";"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          pip install poetry
          poetry install
          
      - name: Build Executable
        shell: bash
        run: |
          CTK_LOCATION=$(poetry run python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))")
          poetry run pyinstaller --noconfirm --onefile --windowed --name er-mailtool \
            --add-data "${CTK_LOCATION}${{ matrix.sep }}customtkinter/" \
            --hidden-import=customtkinter \
            src/main.py
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_name }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
