name: Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: er-mailtool-linux
            binary_name: dist/er-mailtool
            sep: ":"
          - os: windows-latest
            artifact_name: er-mailtool-windows
            binary_name: dist/er-mailtool.exe
            sep: ";"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          pip install poetry
          poetry install
          
      - name: Build Executable
        shell: bash
        run: |
          CTK_LOCATION=$(poetry run python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))")
          poetry run pyinstaller --noconfirm --onefile --windowed --name er-mailtool \
            --add-data "${CTK_LOCATION}${{ matrix.sep }}customtkinter/" \
            --hidden-import=customtkinter \
            src/main.py
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_name }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  package:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: er-mailtool-linux
          path: package/linux

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: er-mailtool-windows
          path: package/windows

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: package/sbom

      - name: Create complete ZIP
        run: |
          test -s package/linux/er-mailtool
          test -s package/windows/er-mailtool.exe
          test -s package/sbom/sbom.spdx.json
          chmod +x package/linux/er-mailtool
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          files = (Path("package/linux/er-mailtool"), Path("package/windows/er-mailtool.exe"),
                   Path("package/sbom/sbom.spdx.json"))
          with ZipFile("er-mailtool-complete.zip", "w", ZIP_DEFLATED) as archive:
              for file in files:
                  archive.write(file, file.name)
          PY

      - name: Upload complete ZIP
        uses: actions/upload-artifact@v4
        with:
          name: er-mailtool-complete
          path: er-mailtool-complete.zip
          if-no-files-found: error
