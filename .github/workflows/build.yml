name: Build

on:
  workflow_call:
    inputs:
      release_version:
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install poetry
          poetry install
          
      - name: Build Executable
        run: |
          # Get CustomTkinter location using pip show to avoid import errors in headless CI
          CTK_LOCATION=$(poetry run pip show customtkinter | grep Location | cut -d' ' -f2)
          CTK_PATH="$CTK_LOCATION/customtkinter"
          
          poetry run pyinstaller --noconfirm --onefile --windowed --name er-mailtool \
            --add-data "$CTK_PATH:customtkinter/" \
            --hidden-import=customtkinter \
            src/main.py
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: er-mailtool-linux
          path: dist/er-mailtool

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
