[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "er-mailtool"
version = "2.0.0"
description = "A portable, secure email testing tool with O365 support."
authors = ["Eidolf <andreas@eidolf.de>"]
packages = [{include = "src"}]

[tool.poetry.scripts]
er-mailtool = "src.main:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
typer = {extras = ["all"], version = "^0.12.3"}
pydantic = "^2.6.0"
python-multipart = "^0.0.9"
python-dotenv = "^1.0.0"
rich = "^13.7.0"
slowapi = "^0.1.9"
customtkinter = "^5.2.2"
packaging = "^23.2"
dnspython = "^2.8.0"
python-whois = "^0.9.6"
email-validator = "^2.1.0"
click = "<8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
ruff = "^0.2.1"
pyinstaller = "^6.3.0"
httpx = "^0.26.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
